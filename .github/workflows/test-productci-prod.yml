name: Product API Production CRUD Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  crud-test:
    runs-on: ubuntu-24.04

    services:
      mongodb:
        image: mongo:latest
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval \"db.adminCommand('ping')\""
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 10s

    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check JavaScript syntax
        run: |
          node --check server.js
          node --check routes/products.js
          node --check models/Product.js

      - name: Wait for MongoDB
        run: |
          for i in {1..30}; do
            if mongosh "mongodb://127.0.0.1:27017/admin" \
              --quiet \
              --eval "db.adminCommand('ping').ok" | grep -q 1; then
              echo "MongoDB is ready"
              exit 0
            fi

            echo "Waiting for MongoDB..."
            sleep 2
          done

          echo "MongoDB did not become ready"
          exit 1

      - name: Start Product API
        env:
          PORT: 3000
          MONGO_URI: mongodb://127.0.0.1:27017/productdb
        run: |
          nohup npm start > product-api.log 2>&1 &
          echo $! > product-api.pid

      - name: Wait for Product API
        run: |
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then
              echo "Product API is ready"
              exit 0
            fi

            echo "Waiting for Product API..."
            sleep 2
          done

          echo "Product API did not become ready"
          cat product-api.log
          exit 1

      - name: Test POST - Create Product
        run: |
          response=$(curl --fail --silent \
            -X POST http://127.0.0.1:3000/api/products \
            -H "Content-Type: application/json" \
            -d '{
              "pid": "CI001",
              "pname": "CI Product",
              "price": 15000000,
              "quantity": 10
            }')

          echo "$response"

          echo "$response" | jq -e '
            .pid == "CI001" and
            .pname == "CI Product" and
            .price == 15000000 and
            .quantity == 10
          '

      - name: Test GET - Get All Products
        run: |
          response=$(curl --fail --silent \
            http://127.0.0.1:3000/api/products)

          echo "$response"

          echo "$response" | jq -e '
            map(select(.pid == "CI001")) | length == 1
          '

      - name: Test GET - Get Product By PID
        run: |
          response=$(curl --fail --silent \
            http://127.0.0.1:3000/api/products/CI001)

          echo "$response"

          echo "$response" | jq -e '
            .pid == "CI001"
          '

      - name: Test PUT - Update Product
        run: |
          response=$(curl --fail --silent \
            -X PUT http://127.0.0.1:3000/api/products/CI001 \
            -H "Content-Type: application/json" \
            -d '{
              "pname": "Updated CI Product",
              "price": 16000000,
              "quantity": 20
            }')

          echo "$response"

          echo "$response" | jq -e '
            .pid == "CI001" and
            .pname == "Updated CI Product" and
            .price == 16000000 and
            .quantity == 20
          '

      - name: Test DELETE - Delete Product
        run: |
          response=$(curl --fail --silent \
            -X DELETE http://127.0.0.1:3000/api/products/CI001)

          echo "$response"

          echo "$response" | jq -e '
            .message == "Product deleted successfully"
          '

      - name: Verify Product Deleted
        run: |
          status=$(curl --silent \
            --output /dev/null \
            --write-out "%{http_code}" \
            http://127.0.0.1:3000/api/products/CI001)

          if [ "$status" != "404" ]; then
            echo "Expected HTTP 404 but got $status"
            exit 1
          fi

          echo "Product deletion verified"

      - name: Show API log if failed
        if: failure()
        run: |
          echo "===== Product API Log ====="
          cat product-api.log || true