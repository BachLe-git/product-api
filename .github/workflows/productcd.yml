name: Product API CD

on:
  workflow_run:
    workflows:
      - Product API Production CRUD Test
    types:
      - completed
    branches:
      - main

jobs:
  docker-publish:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/product-api:latest
            ${{ vars.DOCKERHUB_USERNAME }}/product-api:${{ github.event.workflow_run.head_sha }}

  deploy-local:
    needs: docker-publish
    runs-on: [self-hosted, windows, x64, local-docker]

    steps:
      - name: Checkout deployment files
        uses: actions/checkout@v7

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pull latest Product API image
        shell: powershell
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
        run: |
          docker pull "$env:DOCKERHUB_USERNAME/product-api:latest"

      - name: Deploy with Docker Compose
        shell: powershell
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
        run: |
          docker compose -f docker-compose-prod.yaml pull
          docker compose -f docker-compose-prod.yaml up -d

      - name: Wait for containers to become healthy
        shell: powershell
        run: |
          $timeout = 120
          $elapsed = 0

          while ($elapsed -lt $timeout) {
            $mongo = docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' nammongodb-prod 2>$null
            $api = docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' product-api-prod 2>$null

            Write-Host "MongoDB: $mongo"
            Write-Host "Product API: $api"

            if ($mongo -eq "healthy" -and $api -eq "healthy") {
              Write-Host "Both containers are healthy."
              exit 0
            }

            Start-Sleep -Seconds 5
            $elapsed += 5
          }

          Write-Host "Healthcheck failed."
          docker compose -f docker-compose-prod.yaml ps
          docker compose -f docker-compose-prod.yaml logs --tail=100
          exit 1

      - name: Verify Product API health endpoint
        shell: powershell
        run: |
          $response = Invoke-RestMethod http://localhost:3000/health

          Write-Host ($response | ConvertTo-Json)

          if ($response.status -ne "UP") {
            throw "Product API status is not UP"
          }

          if ($response.mongodb -ne "CONNECTED") {
            throw "MongoDB is not connected"
          }

          Write-Host "Product API healthcheck passed."